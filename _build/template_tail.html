<!-- ===== Scripts at bottom ===== -->
<script defer src="https://unpkg.com/mermaid@10/dist/mermaid.min.js"></script>
<script defer src="https://unpkg.com/svg-pan-zoom@3.6.1/dist/svg-pan-zoom.min.js"></script>
<script>
var b=document.getElementById('themeBtn');
b.onclick=function(){var h=document.documentElement;h.dataset.theme=h.dataset.theme==='dark'?'light':'dark';try{localStorage.setItem('theme',h.dataset.theme)}catch(e){}};
try{var s=localStorage.getItem('theme');if(s)document.documentElement.dataset.theme=s}catch(e){}

var obs=new IntersectionObserver(function(entries){entries.forEach(function(e){if(e.isIntersecting){document.querySelectorAll('.sidebar a').forEach(function(a){a.classList.remove('active')});var l=document.querySelector('.sidebar a[href="#'+e.target.id+'"]');if(l)l.classList.add('active')}})},{rootMargin:'-60px 0px -70% 0px'});
document.querySelectorAll('h2[id],h3[id]').forEach(function(h){obs.observe(h)});

var pzObs=null;
function setupPanZoom(){
  if(typeof svgPanZoom==='undefined')return;
  var wraps=document.querySelectorAll('.mermaid-wrap'),done=0;
  wraps.forEach(function(w){
    var svg=w.querySelector('svg');
    if(!svg)return;
    if(svg.getAttribute('data-pz')){done++;return;}
    if(!svg.getAttribute('viewBox'))return;
    svg.setAttribute('data-pz','1');
    svg.removeAttribute('height');
    svg.style.width='100%';svg.style.height='100%';svg.style.maxWidth='none';
    try{
      w._svgpz=svgPanZoom(svg,{zoomEnabled:true,controlIconsEnabled:true,panEnabled:true,dblClickZoomEnabled:true,mouseWheelZoomEnabled:true,fit:true,center:true,minZoom:0.2,maxZoom:40,zoomScaleSensitivity:0.25});
      if(!w.querySelector('.mm-hint')){var h=document.createElement('span');h.className='mm-hint';h.textContent='滚轮缩放 · 拖拽平移';w.appendChild(h);}
      done++;
    }catch(e){}
  });
  if(wraps.length>0&&done===wraps.length&&pzObs){pzObs.disconnect();pzObs=null;}
}
async function renderMermaidAll(){
  if(typeof mermaid==='undefined')return;
  try{
    mermaid.initialize({startOnLoad:false,theme:document.documentElement.dataset.theme==='dark'?'dark':'default',securityLevel:'loose'});
    var nodes=document.querySelectorAll('.mermaid');
    for(var i=0;i<nodes.length;i++){
      var el=nodes[i];
      if(el.getAttribute('data-rendered'))continue;
      try{
        var r=await mermaid.render('mmd_'+i, el.textContent);
        el.innerHTML=r.svg;
        el.setAttribute('data-rendered','1');
      }catch(e){}
    }
  }catch(e){}
  setupPanZoom();
}
window.addEventListener('load',function(){
  renderMermaidAll();
  pzObs=new MutationObserver(function(){clearTimeout(window._pzt);window._pzt=setTimeout(setupPanZoom,200);});
  pzObs.observe(document.body,{childList:true,subtree:true});
  setTimeout(setupPanZoom,1500);
});
</script>
</body>
