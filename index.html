<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edge AI Docs - 端侧 AI 学习文档</title>
<style>
:root{--bg:#fff;--bg2:#f8f9fa;--bg3:#e9ecef;--text:#1a1a2e;--text2:#495057;--muted:#868e96;--accent:#4361ee;--accentL:#eef2ff;--border:#dee2e6}
[data-theme=dark]{--bg:#0f0f1a;--bg2:#1a1a2e;--bg3:#2a2a3e;--text:#e0e0e0;--text2:#adb5bd;--muted:#6c757d;--accent:#7b8cff;--accentL:#1a1a3e;--border:#2a2a3e}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans SC",sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
.wrap{max-width:1100px;margin:0 auto;padding:40px 24px}
header{text-align:center;margin-bottom:32px}
h1{font-size:32px;font-weight:800;margin-bottom:8px}
header p{color:var(--muted);font-size:15px;max-width:640px;margin:0 auto}
.theme-btn{position:fixed;top:16px;right:16px;background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:8px 12px;cursor:pointer;font-size:16px;color:var(--text);z-index:100}

/* 分类切换标签（三个大类各自成页） */
.tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:44px}
.tab{padding:10px 22px;border-radius:10px;border:1px solid var(--border);background:var(--bg2);color:var(--text2);font-size:14px;font-weight:600;cursor:pointer;transition:all .2s}
.tab:hover{border-color:var(--accent);color:var(--text)}
.tab.active{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 4px 14px rgba(67,97,238,.3)}

/* 大类内容 */
.cat-name{font-size:24px;font-weight:800;display:flex;align-items:baseline;gap:10px;padding-bottom:12px;border-bottom:1px solid var(--border);margin-bottom:24px}
.cat-note{font-size:13px;font-weight:500;color:var(--muted)}
.subhead{font-size:12px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:2px;margin:24px 0 14px;display:flex;align-items:center;gap:8px}
.subhead::after{content:'';flex:1;height:1px;background:var(--border)}

/* 卡片网格（通用文档 / 项目内文档共用） */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.card{display:block;background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:18px 20px;text-decoration:none;color:var(--text);transition:all .2s;position:relative}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.1);border-color:var(--accent)}
.card h3{font-size:16px;font-weight:700;margin-bottom:4px;padding-right:52px}
.card .desc{font-size:13px;color:var(--text2);margin-bottom:10px}
.tags{display:flex;gap:4px;flex-wrap:wrap}
.tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;background:var(--accentL);color:var(--accent)}
.badge{position:absolute;top:12px;right:12px;font-size:10px;font-weight:700;padding:2px 8px;border-radius:4px}
.b-done{background:#d4edda;color:#155724}.b-wip{background:#fff3cd;color:#856404}.b-todo{background:var(--bg3);color:var(--muted)}
[data-theme=dark] .b-done{background:#14371f;color:#8fd6a4}[data-theme=dark] .b-wip{background:#3a3312;color:#e6cf7a}

/* 项目竖向时间轴 */
.ptl{position:relative;padding-left:30px}
.ptl::before{content:'';position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:linear-gradient(var(--accent),var(--border))}
.ptl-item{position:relative;margin-bottom:32px}
.ptl-item:last-child{margin-bottom:0}
.ptl-item::before{content:'';position:absolute;left:-26px;top:4px;width:14px;height:14px;border-radius:50%;background:var(--bg);border:3px solid var(--accent);box-shadow:0 0 0 4px var(--bg)}
.ptl-head{display:flex;align-items:baseline;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.ptl-name{font-size:17px;font-weight:700}
.ptl-period{font-size:11px;font-weight:600;color:var(--accent);background:var(--accentL);padding:2px 10px;border-radius:999px;white-space:nowrap}

/* 项目简介入口卡（顶部独立，banner 式，点进简介页） */
.proj-intro{display:block;position:relative;background:linear-gradient(135deg,var(--accentL),var(--bg2));border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:12px;padding:16px 20px;margin-bottom:20px;text-decoration:none;color:var(--text);transition:all .2s}
.proj-intro:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.1);border-color:var(--accent)}
.pi-line{display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding-right:60px}
.pi-title{font-size:16px;font-weight:700}
.pi-cta{font-size:12px;font-weight:600;color:var(--accent);white-space:nowrap;margin-left:auto}
.pi-desc{font-size:13px;color:var(--text2);margin:6px 0 8px}

/* 书架：无边框屏幕，边框为一道逆时针流动的渐变发光线条（从左上角出发绕一圈回到左上角）；文档自动横向循环滚动；悬停暂停可拖拽 */
@property --shelfang{syntax:'<angle>';initial-value:0deg;inherits:false}
.shelf{margin-top:2px}
.shelf-screen{position:relative;--shelfang:0deg;border:2px solid transparent;border-radius:16px;background:linear-gradient(var(--bg2),var(--bg2)) padding-box,conic-gradient(from calc(var(--shelfang) + 315deg),rgba(67,97,238,.30) 0deg,rgba(67,97,238,.30) 40deg,#4cc9f0 75deg,#eaf7ff 100deg,#9b5de5 125deg,rgba(67,97,238,.30) 165deg,rgba(67,97,238,.30) 360deg) border-box;padding:18px 16px 12px;overflow:hidden;animation:shelfspin 5s linear infinite}
@keyframes shelfspin{from{--shelfang:0deg}to{--shelfang:-360deg}}
.shelf-screen::after{content:'';position:absolute;top:0;left:8%;right:8%;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);pointer-events:none}
.shelf-scroll{position:relative;overflow:hidden}
.shelf-scroll.editing{overflow-x:auto;scrollbar-width:thin}
.shelf-scroll.editing::-webkit-scrollbar{height:6px}
.shelf-scroll.editing::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.shelf-track{position:relative;display:flex;gap:14px;width:max-content;padding:4px 2px 10px;will-change:transform}
.shelf-track .card{flex:0 0 280px}
.shelf-clone{pointer-events:none}

/* 拖拽排序 */
.grid[data-sortable] .card{cursor:grab}
.shelf-track[data-sortable] .card{cursor:grab}
.ptl-item[draggable]>.ptl-head{cursor:grab}
.dragging{opacity:.35;cursor:grabbing!important}
.reset-btn{background:none;border:1px solid var(--border);border-radius:6px;padding:2px 10px;font-size:12px;color:var(--muted);cursor:pointer;margin-left:10px;transition:all .2s;vertical-align:middle}
.reset-btn:hover{color:var(--accent);border-color:var(--accent)}

footer{text-align:center;margin-top:56px;padding:20px;color:var(--muted);font-size:12px}
</style>
</head>
<body>
<button class="theme-btn" id="themeBtn">Light / Dark</button>
<div class="wrap">
  <header>
    <h1 id="title">Edge AI Docs</h1>
    <p id="subtitle"></p>
  </header>
  <nav class="tabs" id="tabs"></nav>
  <main id="catalog"></main>
  <footer>Edge AI Docs -- 算法训练/微调 | 部署与优化 | Agent 框架 <button class="reset-btn" id="resetOrder" style="display:none">恢复默认排序</button></footer>
</div>
<script>
// 主题切换
var b=document.getElementById('themeBtn');
b.onclick=function(){var h=document.documentElement;h.dataset.theme=h.dataset.theme==='dark'?'light':'dark';try{localStorage.setItem('theme',h.dataset.theme)}catch(e){}};
try{var s=localStorage.getItem('theme');if(s)document.documentElement.dataset.theme=s}catch(e){}

// 目录由 docs.json 驱动（单一数据源，与主站共享）
function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e;}
var BADGE={done:'b-done',wip:'b-wip',todo:'b-todo'};

function card(d){
  var a=el('a','card');a.href=d.file;
  if(/^https?:\/\//.test(d.file)){a.target='_blank';a.rel='noopener noreferrer';}
  if(d.badge)a.appendChild(el('span','badge '+(BADGE[d.status]||'b-done'),d.badge));
  a.appendChild(el('h3',null,d.title));
  if(d.desc)a.appendChild(el('p','desc',d.desc));
  if(d.tags&&d.tags.length){var t=el('div','tags');d.tags.forEach(function(tag){t.appendChild(el('span','tag',tag));});a.appendChild(t);}
  return a;
}
// grid：section 非空时该网格可拖拽排序（记录 cat/section/project 供持久化）
function grid(docs,cid,section,project){
  var g=el('div','grid');
  var sortable=(section!=null);
  if(sortable){g.dataset.sortable='1';g.dataset.cat=cid;g.dataset.section=section;if(project!=null)g.dataset.project=project;}
  (docs||[]).forEach(function(d){
    var c=card(d);
    if(sortable){c.setAttribute('draggable','true');c.dataset.file=d.file;c.title='拖拽调整顺序';}
    g.appendChild(c);
  });
  return g;
}

// 项目简介入口卡（顶部独立 banner，点进简介页）；cta 可自定义按钮文案
function introCard(d,cta){
  var a=el('a','proj-intro');a.href=d.file;
  if(/^https?:\/\//.test(d.file)){a.target='_blank';a.rel='noopener noreferrer';}
  if(d.badge)a.appendChild(el('span','badge '+(BADGE[d.status]||'b-done'),d.badge));
  var line=el('div','pi-line');
  line.appendChild(el('span','pi-title',d.title));
  line.appendChild(el('span','pi-cta',cta||'查看项目简介 →'));
  a.appendChild(line);
  if(d.desc)a.appendChild(el('p','pi-desc',d.desc));
  if(d.tags&&d.tags.length){var t=el('div','tags');d.tags.forEach(function(tag){t.appendChild(el('span','tag',tag));});a.appendChild(t);}
  return a;
}
// 书架：无边框屏幕（渐变发光边框），文档自动横向循环滚动；悬停暂停并切到可拖拽单列
function shelf(docs,cid,project,section){
  var wrap=el('div','shelf');
  var screen=el('div','shelf-screen');
  var scroll=el('div','shelf-scroll');
  var track=el('div','shelf-track');
  track.dataset.sortable='1';track.dataset.cat=cid;track.dataset.section=section||'project';if(project!=null)track.dataset.project=project;
  (docs||[]).forEach(function(d){
    var c=card(d);
    c.setAttribute('draggable','true');c.dataset.file=d.file;c.title='拖拽调整顺序';
    track.appendChild(c);
  });
  scroll.appendChild(track);
  screen.appendChild(scroll);
  wrap.appendChild(screen);
  renumberShelf(track);
  setupShelfMarquee(screen,scroll,track);
  return wrap;
}
// 按当前 DOM 顺序给 Part 徽章重新编号（从 1 开始，跟随拖拽后的位置）
function renumberShelf(track){
  var cards=[].slice.call(track.querySelectorAll('.card:not(.shelf-clone)'));
  var partCards=cards.filter(function(c){var b=c.querySelector('.badge');return b&&/^Part\s*\d+$/i.test(b.textContent.trim());});
  partCards.forEach(function(c,i){c.querySelector('.badge').textContent='Part '+(i+1);});
}
// 屏幕跑马灯：内容宽于屏幕才克隆+无缝滚动；能放下则静态居中（修复单卡克隆出重复的 bug）。
// 仅进入视口时滚动；悬停时去克隆、暂停并切成可拖拽单列。
function setupShelfMarquee(screen,scroll,track){
  var offset=0,hovering=false,visible=false,setW=0,speed=0.7,rafId=null,needScroll=false;
  function realCards(){return [].slice.call(track.querySelectorAll('.card:not(.shelf-clone)'));}
  function removeClones(){[].slice.call(track.querySelectorAll('.shelf-clone')).forEach(function(x){x.remove();});}
  function addClones(){
    removeClones();
    realCards().forEach(function(c){var cl=c.cloneNode(true);cl.classList.add('shelf-clone');cl.removeAttribute('draggable');cl.setAttribute('aria-hidden','true');track.appendChild(cl);});
  }
  // 真实卡片总宽超出视口才滚动；否则静态居中并移除克隆
  function layout(){
    var rc=realCards();
    if(!rc.length||!track.offsetParent){needScroll=false;removeClones();track.style.margin='';return;}
    var first=rc[0],last=rc[rc.length-1];
    var span=(last.offsetLeft+last.offsetWidth)-first.offsetLeft;
    needScroll=span>scroll.clientWidth+1;
    if(needScroll){
      if(!track.querySelector('.shelf-clone'))addClones();
      var fc=track.querySelector('.shelf-clone');
      setW=fc?(fc.offsetLeft-first.offsetLeft):0;
      track.style.margin='';
    }else{
      removeClones();setW=0;offset=0;track.style.transform='none';track.style.margin='0 auto';
    }
  }
  function step(){
    rafId=null;
    if(visible&&!hovering&&needScroll&&setW>0){
      offset+=speed;
      if(offset>=setW)offset-=setW;
      track.style.transform='translateX('+(-offset)+'px)';
    }
    if(visible&&needScroll)rafId=requestAnimationFrame(step);
  }
  function startLoop(){if(rafId==null&&visible&&needScroll)rafId=requestAnimationFrame(step);}
  function stopLoop(){if(rafId!=null){cancelAnimationFrame(rafId);rafId=null;}}
  // 仅当屏幕进入视口才滚动（滚出视口暂停并停掉 rAF，避免多屏同时空转）
  if('IntersectionObserver' in window){
    var io=new IntersectionObserver(function(entries){
      entries.forEach(function(e){visible=e.isIntersecting;if(visible){layout();startLoop();}else{stopLoop();}});
    },{threshold:0});
    io.observe(screen);
  }else{visible=true;layout();startLoop();}
  screen.addEventListener('mouseenter',function(){
    hovering=true;removeClones();offset=0;track.style.transform='none';scroll.classList.add('editing');
  });
  screen.addEventListener('mouseleave',function(){
    renumberShelf(track);scroll.classList.remove('editing');hovering=false;layout();startLoop();
  });
  track.addEventListener('dragend',function(){renumberShelf(track);});
}

// 兼容旧结构：老 docs.json 用扁平 groups；新结构用 categories(general + projects)
function normalize(data){
  if(data.categories)return data.categories;
  return (data.groups||[]).map(function(g,i){return {name:g.name,id:'g'+i,note:g.note,general:g.docs,projects:[]};});
}
function catId(cat,i){return cat.id||('c'+i);}

/* ===== 拖拽排序 =====
 * 顺序写入 localStorage（静态站无法回写 docs.json，只在本浏览器生效）。
 * 结构：{ <catid>: { general:[file...], projects:[name...], "pdocs:<name>":[file...] } } */
var ORDER_KEY='edgeai-order';
function loadAllOrder(){try{var o=JSON.parse(localStorage.getItem(ORDER_KEY)||'{}');return (o&&typeof o==='object')?o:{};}catch(e){return{};}}
function saveAllOrder(o){try{localStorage.setItem(ORDER_KEY,JSON.stringify(o));}catch(e){}}
function hasAnyOrder(){var o=loadAllOrder();for(var k in o){if(o.hasOwnProperty(k))return true;}return false;}
// 按 saved 顺序重排 arr；saved 里没有的新条目按原顺序追加到末尾
function applyOrder(arr,saved,keyFn){
  if(!saved||!saved.length)return arr.slice();
  var byKey={};arr.forEach(function(it){byKey[keyFn(it)]=it;});
  var res=[],used={};
  saved.forEach(function(k){if(byKey.hasOwnProperty(k)&&!used[k]){res.push(byKey[k]);used[k]=1;}});
  arr.forEach(function(it){var k=keyFn(it);if(!used[k]){res.push(it);used[k]=1;}});
  return res;
}
function saveContainerOrder(container){
  var cat=container.dataset.cat,section=container.dataset.section;
  var isProj=(section==='projects');
  var cls=isProj?'ptl-item':'card',attr=isProj?'project':'file';
  var order=[].slice.call(container.children).filter(function(x){return x.classList&&x.classList.contains(cls)&&!x.classList.contains('shelf-clone');}).map(function(x){return x.dataset[attr];});
  var all=loadAllOrder();
  if(!all[cat])all[cat]={};
  all[cat][isProj?'projects':(section==='general'?'general':'pdocs:'+container.dataset.project)]=order;
  saveAllOrder(all);
  updateResetBtn();
}

var dragEl=null,dragSel=null;
function getAfter(container,sel,x,y,isGrid){
  var els=[].slice.call(container.querySelectorAll(sel+':not(.dragging)'));
  if(!els.length)return null;
  if(!isGrid){ // 竖向列表：按 Y 找插入点
    var closest=null,closestOffset=Number.NEGATIVE_INFINITY;
    els.forEach(function(child){
      var box=child.getBoundingClientRect();
      var offset=y-box.top-box.height/2;
      if(offset<0&&offset>closestOffset){closestOffset=offset;closest=child;}
    });
    return closest;
  }
  // 网格：找中心最近的卡片，光标在其右半则插到它后面
  var nearest=null,minDist=Infinity;
  els.forEach(function(child){
    var box=child.getBoundingClientRect();
    var cx=box.left+box.width/2,cy=box.top+box.height/2;
    var d=(x-cx)*(x-cx)+(y-cy)*(y-cy);
    if(d<minDist){minDist=d;nearest=child;}
  });
  if(!nearest)return null;
  var nb=nearest.getBoundingClientRect();
  if(x<=nb.left+nb.width/2)return nearest;
  var next=nearest.nextElementSibling;
  while(next&&next.classList.contains('dragging'))next=next.nextElementSibling;
  return next;
}
function makeSortable(container,sel,isGrid){
  container.addEventListener('dragstart',function(e){
    var item=(e.target&&e.target.closest)?e.target.closest(sel):null;
    if(!item||item.parentElement!==container)return;
    dragEl=item;dragSel=sel;
    item.classList.add('dragging');
    e.dataTransfer.effectAllowed='move';
    try{e.dataTransfer.setData('text/plain','');}catch(_){}
    if(isGrid)e.stopPropagation(); // 拖卡片时不要连带拖动外层项目
  });
  container.addEventListener('dragover',function(e){
    if(!dragEl||dragSel!==sel||dragEl.parentElement!==container)return;
    e.preventDefault();
    e.dataTransfer.dropEffect='move';
    var after=getAfter(container,sel,e.clientX,e.clientY,isGrid);
    if(after==null)container.appendChild(dragEl);
    else container.insertBefore(dragEl,after);
  });
  container.addEventListener('drop',function(e){e.preventDefault();});
  container.addEventListener('dragend',function(){
    if(!dragEl)return;
    dragEl.classList.remove('dragging');
    var c=dragEl.parentElement;
    dragEl=null;dragSel=null;
    if(c&&c.dataset&&c.dataset.sortable)saveContainerOrder(c);
  });
}

// 渲染单个大类（相当于一个「页面」），按 localStorage 里的自定义顺序
function renderCategory(cat,cid){
  var catalog=document.getElementById('catalog');
  catalog.innerHTML='';
  var saved=loadAllOrder()[cid]||{};
  var name=el('div','cat-name');
  name.appendChild(el('span',null,cat.name));
  if(cat.note)name.appendChild(el('span','cat-note',cat.note));
  catalog.appendChild(name);

  // 置顶导读（overview，固定不可拖）
  if(cat.overview)catalog.appendChild(grid([cat.overview]));

  // 上半：通识文档 —— 面试文档做成简介式入口卡（内容不变），其余进书架
  var general=applyOrder(cat.general||[],saved.general,function(d){return d.file;});
  if(general.length){
    catalog.appendChild(el('div','subhead','通用文档 · 基础与面试'));
    var interview=null,genOthers=[];
    general.forEach(function(d){if(d.kind==='面试'&&!interview)interview=d;else genOthers.push(d);});
    if(interview)catalog.appendChild(introCard(interview,'开始答题 →'));
    if(genOthers.length)catalog.appendChild(shelf(genOthers,cid,null,'general'));
  }
  // 下半：项目（竖向时间轴，项目整体可上下拖）
  var projects=applyOrder(cat.projects||[],saved.projects,function(p){return p.name;});
  if(projects.length){
    catalog.appendChild(el('div','subhead','项目 · 时间轴'));
    var ptl=el('div','ptl');
    ptl.dataset.sortable='1';ptl.dataset.cat=cid;ptl.dataset.section='projects';
    projects.forEach(function(p){
      var pdocs=applyOrder(p.docs||[],saved['pdocs:'+p.name],function(d){return d.file;});
      var item=el('div','ptl-item');
      item.dataset.project=p.name;
      item.setAttribute('draggable','true');
      var head=el('div','ptl-head');
      head.appendChild(el('span','ptl-name',p.name));
      if(p.period)head.appendChild(el('span','ptl-period',p.period));
      item.appendChild(head);
      if(p.intro){
        item.appendChild(introCard(p.intro));
        item.appendChild(shelf(pdocs,cid,p.name));
      }else{
        item.appendChild(grid(pdocs,cid,'project',p.name));
      }
      ptl.appendChild(item);
    });
    catalog.appendChild(ptl);
  }

  // 绑定拖拽（通用网格 + 项目网格 + 书架横向滚动区）
  [].slice.call(catalog.querySelectorAll('[data-sortable][data-section="general"],[data-sortable][data-section="project"]')).forEach(function(g){makeSortable(g,'.card',true);});
  var ptlEl=catalog.querySelector('.ptl[data-sortable]');
  if(ptlEl)makeSortable(ptlEl,'.ptl-item',false);
}

function updateResetBtn(){
  var rb=document.getElementById('resetOrder');
  if(rb)rb.style.display=hasAnyOrder()?'':'none';
}

fetch('docs.json',{cache:'no-cache'}).then(function(r){return r.json();}).then(function(data){
  if(data.title)document.getElementById('title').textContent=data.title;
  document.getElementById('subtitle').textContent=data.subtitle||'';
  var cats=normalize(data);
  var tabsEl=document.getElementById('tabs');
  var btns=[];

  function activate(i){
    btns.forEach(function(btn,j){btn.className='tab'+(j===i?' active':'');});
    var id=catId(cats[i],i);
    renderCategory(cats[i],id);
    if(('#'+id)!==location.hash){try{history.replaceState(null,'',location.pathname+'#'+id);}catch(e){location.hash=id;}}
  }

  cats.forEach(function(cat,i){
    var btn=el('button','tab',cat.name);
    btn.onclick=function(){activate(i);};
    tabsEl.appendChild(btn);btns.push(btn);
  });

  // 初始：按 hash 定位到对应大类，否则第一个
  var want=(location.hash||'').replace('#','');
  var start=0;
  cats.forEach(function(cat,i){if(catId(cat,i)===want)start=i;});
  activate(start);
  updateResetBtn();

  var rb=document.getElementById('resetOrder');
  if(rb)rb.onclick=function(){
    try{localStorage.removeItem(ORDER_KEY);}catch(e){}
    var ai=0;for(var k=0;k<btns.length;k++){if(btns[k].classList.contains('active')){ai=k;break;}}
    activate(ai);
    updateResetBtn();
  };

  window.addEventListener('hashchange',function(){
    var h=(location.hash||'').replace('#','');
    cats.forEach(function(cat,i){if(catId(cat,i)===h&&!btns[i].classList.contains('active'))activate(i);});
  });
}).catch(function(){
  document.getElementById('catalog').innerHTML='<p style="text-align:center;color:var(--muted)">目录加载失败，请刷新重试。</p>';
});
</script>
</body>
</html>
